services:
  service:
    build: app
    volumes:
      - django_static:/var/www/
    expose:
      - "8000"
    env_file:
      - ./.env

  nginx:
    image: nginx:latest
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./configs:/etc/nginx/conf.d:ro
      - django_static:/var/www/
    depends_on:
      - service
    ports:
      - "80:80"

  theatre-db:
    image: postgres:16
    env_file:
      - ./.env
    volumes:
      - theatre_data:/var/lib/postgresql/data
      - ./database_dump.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  django_static:
  theatre_data: